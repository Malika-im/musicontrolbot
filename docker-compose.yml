version: "3.9"

services:
  # ===============================================================
  # PostgreSQL Database
  # ===============================================================
  postgres:
    image: postgres:16-alpine
    container_name: aimusic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimusic_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aimusic_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimusic} -d ${POSTGRES_DB:-aimusic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===============================================================
  # Redis Cache & Task Broker
  # ===============================================================
  redis:
    image: redis:7-alpine
    container_name: aimusic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===============================================================
  # FastAPI Webhook Server
  # ===============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aimusic_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - shared_storage:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # ===============================================================
  # Celery Background AI Worker (Supports GPU & CPU)
  # ===============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aimusic_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - shared_storage:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=1
      -n worker_audio@%h
    # GPU Acceleration configuration (uncomment if NVIDIA GPU is present)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  shared_storage:
